  arm: left
  note: "以下为左臂实测观测；右臂 192.168.1.19 本轮未接触，全表 status 仍为 blocked"
  udp_stability_600s:
    duration_s: 600
    frames: 24002
    expected_frames: 120000
    observed_period_ms: 24.998
    configured_period_ms: 5
    period_multiple_ok: true
    dropout_count: 0
    max_gap_ms: 0.0
    source: "RM75-B 192.168.1.18 真机 600 s 长跑（rmctl.hwcollect udp_stability --duration-s 600）"
    method: "SDK 主动上报回调计数 + 50 ms 采样窗判断流；周期由 frames/elapsed 反算"
    note: "到达率 20% 的根因是控制器实际以 25 ms 周期上报（配置 5 ms 的 5 倍），不是随机丢包"
arms:
  left:
    ip: "192.168.1.18"
    tcp_port: 8080
    udp_port: 8091
  right:
    ip: "192.168.1.19"
    tcp_port: 8080
    udp_port: 8092          # 预留第二臂（单臂窗口只占用 8091）
realtime_report:
  period_ms: 5              # **配置**的实时上报周期（5 ms 的倍数）
  measured_period_ms: 25    # **实测**周期（2026-11-19，600 s 长跑）：控制器实际按配置的 5 倍上报
  cycle_multiple_ms: 5      # SDK cycle 单位 = 5 ms
  mode: triple_thread       # rm_init(RM_TRIPLE_MODE_E)：不开三线程收不到 UDP
  note: "配置 5 ms → 实测 25 ms（5 的整数倍，断流窗口 0）：控制器把上报周期按 5 ms 的整数倍取用；本表据此记两个值，不把配置值当实测值"
constraints:
  single_client_per_endpoint: true   # 同一 ip:port 单客户端（上一个进程未退净会静默失败）
  triple_thread_mode: true           # 必须三线程模式
  wired_direct: true                 # 有线直连，关闭防火墙
  # 2026-11-19 真机实测：控制器对客户端连接数有上限（≈5），超过后
  # rm_create_robot_arm 返回 NULL / id=-1，且释放很慢（5~10 min 量级）。
  # 因此**一轮真机工作建一次链、全程复用**（探针 / hwcollect / 执行层均支持
  # 注入既有句柄）。详见 docs/rm_hw_bridge硬件适配层说明.md §9。
  max_clients_per_controller: 5
  reuse_single_connection_per_run: true
notes:
  - "UDP 8092 为第二臂预留；单臂窗口不得占用"
  - "端口占用/单客户端约束导致静默失败，采集前用 ss -ulnp 确认端口空闲"
  - "2026-11-13 首次窗口结论：规划值来自官方配置（未经实连验证），status=blocked"
  - "2026-11-19 复测结论：左臂 192.168.1.18 连通性与最小动作控制**已验证**（见 attempted_actions）；**UDP 主动上报 600 s 长跑已实测**（见 partial_observations.udp_stability_600s）；**右臂 192.168.1.19 仍未接触**、**执行层 600 s 连续执行长跑与断流复现仍未执行**，status 仍为 blocked"
  - "2026-11-19 新增硬约束：控制器客户端连接数上限 ≈5（见 constraints）—— 一轮真机工作必须建一次链、全程复用"
