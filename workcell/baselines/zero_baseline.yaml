# 真机零位基线（设计 §5.8 零位治理；归档内容：固件版本 + 示教器截图 + 凹槽对齐照片 + 修正后 URDF 零位 + FK 一致性复测）
# 约定：
#   - 关节读数单位为「度」（SDK 返回度，内部换算 rad 只在代码里做一次）。
#   - 未实测项一律写 null，禁止填占位数值；实测后把 status 改为 measured 并补齐证据。
#   - 控制器位姿来自厂商运动学输出，仅用于 FK 交叉校验，不得作为规划真值（设计 §1.4 / R003）。
kind: zero_baseline
schema_version: 1
version: 3                  # 基线修订号（单调递增）
status: blocked            # pending / measured / blocked
captured_at: null           # 采集时间（ISO8601）；未实测写 null
arm: left                   # 本基线所属臂（left / right）——零位按臂独立
firmware: null              # 控制器固件版本
teachpendant_version: null  # 示教器版本
blocked:
  reason: >-
    2026-11-13 真机窗口不可达（ping 100% 丢包，TCP 8080 连接超时），零位读数与 FK 一致性复测未能采集；
    2026-11-19 连通性已恢复（远端主机 ping 192.168.1.18 正常、TCP 8080 可连、RM-API2 握手成功、
    状态快照可读、最小动作验证通过），但**本基线要求的采集项一个都还没做**：
    控制器固件版本、示教器版本、零位照片取证、FK 一致性复测全部仍为 null。
    本基线**没有任何实测数值**，不得据此推断零位。
  attempted_actions:
    - "门禁1 SDK 到位：RM-API2 1.1.7 已就位（.deps/rm_api2/libapi_c.so，rm_api_version() 实际返回 b'1.1.7'）"
    - "门禁2 nm -D 复核：11 个白名单符号全部导出（rm_init / rm_create_robot_arm / rm_set_realtime_push / rm_get_joint_degree / rm_get_current_arm_state / rm_get_arm_all_state / rm_movej / rm_set_arm_stop / rm_set_arm_slow_stop / rm_set_arm_pause / rm_set_arm_continue）"
    - "门禁3 网络连通（2026-11-13）：ping 192.168.1.18 与 192.168.1.19 均 100% 丢包；/dev/tcp 192.168.1.18/8080 连接超时"
    - "门禁4 UDP 端口：ss -ulnp 未见 8091/8092 占用（本机侧无冲突，非阻塞原因）"
    - "门禁5 环境可导入：rmctl.hwcollect 正常导入并成功装载 SDK（SDK 不再是阻塞点）"
    - "真机路径实跑：zero_capture / fk_cross 落盘 status=error，证据 rm_get_joint_degree 返回码 -1"
    - "2026-11-19 复测（远端主机）：连通性恢复，rmctl connect 读到 7 轴关节角；rm75_safe_probe 最小动作（0.3°/去程回程）通过 —— 但零位照片、固件/示教器版本、FK 一致性复测**未执行**"
  next_action: >-
    取得真机窗口后按 docs/code_doc/真机基线与实测限值归档说明.md 第 3 节执行：
    示教器受控流程对齐凹槽 → 照片取证 → python3 -m rmctl.hwcollect zero_capture →
    python3 -m rmctl.hwcollect fk_cross → rmctl.fk_cross 出报告 → 回填本文件并把 status 改为 measured
