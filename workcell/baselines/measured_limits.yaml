# 真机实测限值基线（设计 §5.2：加速度上限官方未给 RM75 数值，必须实测后回填）
# 约定：
#   - 加速度单位 rad/s^2，jerk 单位 rad/s^3，TCP 重复性单位 mm。
#   - 每条实测值必须带 source（来源，可追溯）/ method（采集方法）/ samples（样本数 ≥ 3）。
#   - 未实测项一律写 null，禁止填占位数值；status=measured 时数值不得高于
#     dualarm_ws/src/rm_description/config/joint_limits.yaml 的已生效限值。
#   - 重复性 ≠ 绝对精度：官方只标重复定位 ±0.05 mm，不标绝对精度。
kind: measured_limits
schema_version: 1
version: 5                  # 基线修订号（单调递增）
status: blocked            # pending / measured / blocked
captured_at: null
arm: left
blocked:
  reason: >-
    2026-11-13 真机窗口不可达（ping 100% 丢包、TCP 8080 连接超时），acc / jerk 上限与 TCP 重复性未能实测；
    2026-11-19 连通性已恢复（远端主机 ping 192.168.1.18 正常、TCP 8080 可连、RM-API2 握手成功），
    且**已实测到 joint1 的 acc/jerk（3 档）与 TCP 重复性（30 次）**（见 partial_observations），
    但**joint2..joint7 仍未实测** —— 本基线的状态位是全表口径（status=measured 要求每个关节
    都有 samples≥3 的实测值），因此 acc / jerk 的**基线值字段仍必须为 null**，
    joint_limits.yaml 中的 acceleration=5.2359 / jerk=30.0 也**未**被改写
    （回填工具要求 baseline status=measured 才允许回填，见下方 next_action）。
    2026-11-20 远端主机真机窗口只做了 **FK 交叉校验复测**（8 组有界多样位形、幅度 ≤5°），
    该实验**不产生**任何 acc / jerk 数据（acc/jerk 需阶梯位移实验，幅度与采样序列不同，
    两者不可互相代偿），因此本轮**没有新增**可回填的限值实测项：值字段保持 null、
    status 保持 blocked、joint_limits.yaml 未被改写。
  attempted_actions:
    - "门禁1 SDK 到位：RM-API2 1.1.7 已就位（.deps/rm_api2/libapi_c.so，rm_api_version() 返回 b'1.1.7'）"
    - "门禁2 nm -D 复核：11 个白名单符号全部导出"
    - "门禁3 网络连通（2026-11-13）：ping 192.168.1.18 / 192.168.1.19 均 100% 丢包；TCP 8080 连接超时"
    - "门禁4 UDP 端口：ss -ulnp 未见 8091/8092 占用（本机侧无冲突，非阻塞原因）"
    - "真机路径实跑：ladder_acc_jerk status=error（rm_get_joint_degree 返回码 -1）、tcp_repeatability status=error（rm_movej 报'机械臂已断开'）"
    - "2026-11-19 复测（远端主机）：连通性恢复，最小动作验证（0.3°/2% 速度/去程回程）通过"
    - "2026-11-19 真机实测（RM75-B 192.168.1.18）：joint1 阶梯 acc/jerk —— 3 档（10°/档、速度 5/8/11%、每档测完回原位），包络（多档最小值，保守下界）acc=1.7557 rad/s^2、jerk=81.099 rad/s^3；见 partial_observations"
    - "2026-11-19 真机实测：TCP 重复性 —— 固定目标（当前位姿）30 次 rm_movej 到位，最大散布 0.0341 mm、平均散布 0.0127 mm、标称 ±0.05 mm（within_nominal=true）；见 partial_observations"
    - "回填工具红线复核：apply_measured_limits.py --dry-run 因 baseline_not_measured 拒绝回填（退出码 3），joint_limits.yaml 未被改写"
    - "2026-11-20 远端主机真机窗口（172.16.119.199:2224 → 容器 ros_dev）：只读门禁五项全通过 + 只读快照全部满足；本轮执行的是 **FK 交叉校验复测**（8 组有界多样位形、幅度 ≤5°、单关节依次、测完回原位），**未做** joint2..joint7 的阶梯 acc/jerk 实验（acc/jerk 需 10°/档 阶梯位移，与 FK 复测的采样序列不同）"
    - "2026-11-20 回填红线复核（第二次）：apply_measured_limits.py --dry-run → **退出码 3 / baseline_not_measured**（15 项拒绝：1 项 status + 7 关节 × acc/jerk），joint_limits.yaml **未被改写**（joint1 jerk 保持 30.0 未放宽；joint1 acceleration 保持 5.2359）"
  next_action: >-
