# 双臂场景：RM75-B 左臂 + 右臂（scenario **正式 schema**，schema_version: 1）
#
# 单位约定（全表 SI，详见 src/rm75_drake/scenario.py 的模块 docstring）：
#   * 长度：m（米）
#   * 角度：**rad（弧度）**，**不接收度**
#   * 时间：s（秒）
#
# 顶层四键固定为 robots / base_extrinsics / obstacles / calibration
# （**不得改名**：会击穿 S07 的 golden-file 回归）。
#
# 本文件是**双臂场景真相源**：两臂的 URDF 是 S04-T01 生成的**重命名变体**
# （models/rm75_drake/rm75_{left,right}.urdf）——Drake 不允许同一份 URDF 在
# 同一个 plant 里装两次（实测 RuntimeError: model instance names must be unique）。
#
# **基座外参**：本文件手写的值只是**无标定文件时的回退值**——
#   **标定文件 calibration/dual_arm.yaml 才是唯一真相源**（见文件末尾 calibration 段）。
#   * 左臂：原点；
#   * 右臂：沿 +x 平移 0.60 m（设计文档推荐区间 0.55–0.70 m）；
#   * 两臂共面（rpy 全 0）、同高；
#   * 真实外参由标定文件给出（measured=false 占位 → 本环境无实测数据）。
#
# 未知键 / 缺字段 / 维度或单位写错 → rm75_drake.scenario.ScenarioError
# （禁止静默默认值）。

schema_version: 1

# 机器人列表（关节顺序 = 规划链路的变量顺序）。
robots:
  - name: left
    urdf: package://rm75_drake/rm75_left.urdf
    base_link: left_base_link
    joint_names:
      - left_joint_1
      - left_joint_2
      - left_joint_3
      - left_joint_4
      - left_joint_5
      - left_joint_6
      - left_joint_7
  - name: right
    urdf: package://rm75_drake/rm75_right.urdf
    base_link: right_base_link
    joint_names:
      - right_joint_1
      - right_joint_2
      - right_joint_3
      - right_joint_4
      - right_joint_5
      - right_joint_6
      - right_joint_7

# 机器人基座相对场景世界系的外参（m / rad）。
#   ⚠ **下面这组手写值只是回退值**：一旦下面的 calibration 段引用了标定文件，
#     **以标定文件为准**（本文件的手写值被标定文件覆盖）。
#     这样保证「基座外参只有一个真相源」，避免两处手写值漂移。
base_extrinsics:
  left:
    xyz: [0.0, 0.0, 0.0]
    rpy: [0.0, 0.0, 0.0]
  right:
    xyz: [0.6, 0.0, 0.0]
    rpy: [0.0, 0.0, 0.0]

# 静态障碍物（双臂工作区的公共障碍物；本切片留空，由后续切片按场景需要填充）。
obstacles: []

# 标定参数（键必须存在，可以是空映射 {}）。
#
# **base_extrinsic 是可选键**（S04-T05 新增）：引用**部署实例标定文件**，
# 相对路径按 <仓库根>/calibration/（paths.calibration_files_dir）解析。
#
# 该标定文件里的基座外参是**唯一真相源**：加载场景时用它**覆盖**上面的
# base_extrinsics 手写值（手写值仅在**不引用**标定文件时生效）。
# 标定文件缺失 / schema 非法 → ScenarioError（点名路径与出错键），**不静默回退**。
calibration:
  base_extrinsic:
    file: dual_arm.yaml
