# 单臂场景：RM75-D + 一个箱体障碍物（scenario **正式 schema**，schema_version: 1）
#
# 单位约定（全表 SI，详见 src/rm75_drake/scenario.py 的模块 docstring）：
#   * 长度：m（米）
#   * 角度：**rad（弧度）**，**不接收度**
#   * 时间：s（秒）
#   * 夹爪开口：u ∈ [0, 1000]
#
# 顶层四键固定为 robots / base_extrinsics / obstacles / calibration
# （S02 落地后**不得改名**：改名会击穿 S07 的 golden-file 回归）。
#
# 未知键 / 缺字段 / 维度或单位写错 → rm75_drake.scenario.ScenarioError
# （禁止静默默认值）。

schema_version: 1

# 机器人列表（关节顺序 = 规划链路的变量顺序）。
robots:
  - name: rm75
    urdf: package://rm75_drake/rm75_drake.urdf
    base_link: base_link
    joint_names:
      - joint_1
      - joint_2
      - joint_3
      - joint_4
      - joint_5
      - joint_6
      - joint_7

# 机器人基座相对场景世界系的外参（m / rad）。
base_extrinsics:
  rm75:
    xyz: [0.0, 0.0, 0.0]
    rpy: [0.0, 0.0, 0.0]

# 静态障碍物。
#   type: 目前支持 box
#   size: **外形全长**（m，x/y/z），不是半长（Drake Box 用半长，装配层自动换算）
#   pose: xyz（m）+ rpy（rad）
obstacles:
  - name: workbench_box
    type: box
    size: [0.60, 0.60, 0.05]
    pose:
      xyz: [0.45, 0.0, 0.025]
      rpy: [0.0, 0.0, 0.0]

# 标定参数（键必须存在，可以是空映射 {}）。
calibration:
  gripper_force:
    # 相对 src/rm75_drake/calibration/ 解析
    file: gripper_force.yaml
