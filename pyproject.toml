[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rm75_drake"
# 版本标识与 versions.lock:baseline.drake 严格对齐（T02 约定，见 src/rm75_drake/__init__.py）。
# 它是"项目基线标识"，不是当前环境实装的 Drake 版本（实装版本见 drake_compat.drake_version()）。
version = "1.55.0"
description = "RM75-D 基于 Drake 的仿真与规划包（T02 骨架：路径层 + package:// 解析 + 版本兼容层）"
requires-python = ">=3.10"
dependencies = [
    "drake>=1.51.1",
    "PyYAML>=6.0",
    "numpy>=1.26",
    # 轨迹重定时（S02-T06）：版本与 versions.lock:packages.toppra 一致（0.6.11）。
    "toppra==0.6.11",
    # 可视化 2D 兜底（S02-T08）：baseline 钉版 3.8.4（见 versions.lock:packages.matplotlib）。
    # 本机实测 Axes3D（mpl_toolkits.mplot3d）导入失败 → rm75_drake.viz 只用 2D。
    "matplotlib>=3.8.4",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "pyyaml",
]
# 设备层（S03）可选依赖：厂商 SDK。
# 分发名是 robotic-arm（小写连字符），**导入名**是 Robotic_Arm（大写 R/A）——
# 两者不一致是经典陷阱，详见 src/rm75_drake/device/sdk.py。
# 版本与 versions.lock:packages.robotic_arm 严格一致（1.1.7）。
# 未安装时设备层**懒加载**并抛显式 NotAvailableError，绝不静默降级。
device = [
    "robotic-arm==1.1.7",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
# planning/ 与 drivers/ 子包必须带 __init__.py（两者都有），
# 否则 pip install -e . 不会把它们收进发行包（S02-T07/T08 依赖它们）。

[tool.setuptools.package-data]
rm75_drake = ["py.typed", "calibration/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: 规划重负载用例（如 IRIS 区域生成，单例数秒至数十秒）；CI fast 档用 -m 'not slow' 跳过",
    "hardware: 需要真机（机械臂）在场才可断言的用例；无真机时必须 SKIP 而不是失败",
    "device: 设备层用例（安全七闸 / 状态机 / 执行环 / 恢复流程 / 运行日志）；零硬件可跑，恒跑",
]
