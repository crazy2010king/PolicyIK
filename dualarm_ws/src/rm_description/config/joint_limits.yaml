  joint5: {lower: -3.106,  upper: 3.106,  velocity: 3.9270, acceleration: 1.7539498082448197, jerk: 30.0}   # ±178°, 225°/s
  joint6: {lower: -2.234,  upper: 2.234,  velocity: 3.9270, acceleration: 1.821400596792399, jerk: 30.0}   # ±128°, 225°/s
