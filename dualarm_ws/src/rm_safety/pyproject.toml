[project]
name = "rm-safety"
version = "0.1.0"
description = "失效安全停机层（四级等级表 + 故障判据纯函数 + 声明式错误码表）"
requires-python = ">=3.9"
dependencies = ["pyyaml"]

[project.optional-dependencies]
test = ["pytest"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["rm_safety*"]
