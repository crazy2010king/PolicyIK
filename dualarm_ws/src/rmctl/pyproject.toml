[project]
name = "rmctl"
version = "0.1.0"
description = "睿尔曼双臂工程操作入口（CLI/REPL/体检/工艺模板）"
requires-python = ">=3.9"
dependencies = ["numpy", "pyyaml", "tesseract-robotics-nanobind==0.35.0.8"]

[project.scripts]
rmctl = "rmctl.cli:main"
rm-planner = "rmctl.planner_service.server:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["rmctl*"]
