# 单臂抓放任务链（S06 示例部署实例数据）。
#
# 语义：approach → pre_grasp → close → verify → lift → transit → place → open → retreat
# 单位：长度 m，角度 rad，时间 s。
schema_version: 1
name: pick_place
description: "单臂抓取方块 cube_a 并放置到 table_a 台面"
robot: left
scenario: single_arm.yaml
objects:
  - name: cube_a
    half_size: [0.02, 0.02, 0.02]
    pose:
      xyz: [0.45, 0.0, 0.02]
      rpy: [0.0, 0.0, 0.0]
  - name: table_a
    half_size: [0.15, 0.15, 0.01]
    pose:
      xyz: [0.55, 0.10, 0.01]
      rpy: [0.0, 0.0, 0.0]
thresholds:
  position_m: 0.005
  orientation_rad: 0.05
primitives:
  - name: approach
    kind: motion
    target:
      xyz: [0.45, 0.0, 0.18]
      rpy: [0.0, 0.0, 0.0]
    tolerance:
      position_m: 0.01
      orientation_rad: 0.1
  - name: pre_grasp
    kind: motion
    target:
      xyz: [0.45, 0.0, 0.10]
      rpy: [0.0, 0.0, 0.0]
    tolerance:
      position_m: 0.005
      orientation_rad: 0.05
  - name: close
    kind: gripper
    action: close
    target_object: cube_a
    hold_seconds: 0.5
  - name: verify
    kind: gripper
    action: close
    target_object: cube_a
    hold_seconds: 0.2
  - name: lift
    kind: motion
    target:
      xyz: [0.45, 0.0, 0.20]
      rpy: [0.0, 0.0, 0.0]
    tolerance:
      position_m: 0.005
      orientation_rad: 0.05
  - name: transit
    kind: motion
    target:
      xyz: [0.55, 0.10, 0.25]
      rpy: [0.0, 0.0, 0.0]
    tolerance:
      position_m: 0.01
      orientation_rad: 0.1
  - name: place
    kind: motion
    target:
      xyz: [0.55, 0.10, 0.05]
      rpy: [0.0, 0.0, 0.0]
    tolerance:
      position_m: 0.005
      orientation_rad: 0.05
  - name: open
    kind: gripper
    action: open
    target_object: cube_a
    hold_seconds: 0.3
  - name: retreat
    kind: motion
    target:
      xyz: [0.55, 0.10, 0.22]
      rpy: [0.0, 0.0, 0.0]
    tolerance:
      position_m: 0.01
      orientation_rad: 0.1
